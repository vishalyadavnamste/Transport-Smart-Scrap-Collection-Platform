<!DOCTYPE html><html>
<head>
  <title>Transport Load Connector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🚛 Transport Load Connector</h1><div class="container">  <h2>Add Load</h2>

  <script src="app.js"></script>
</body>
</html>
